apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: adk-trace-enabled
  namespace: kagent
spec:
  kagent: {}
  workload:
    image: YOUR_IMAGE_NAME_AND_REGISTRY_URL
    command: ["/app"]
  env:
    - name: MODEL_NAME
      value: gpt-4.1-mini
    # Records prompts and responses on the model spans. The Go ADK does this only in
    # SPAN_ONLY mode, which kagent does not set. Remove it to keep content out of traces.
    - name: OTEL_INSTRUMENTATION_GENAI_CAPTURE_MESSAGE_CONTENT
      value: SPAN_ONLY
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/adk-trace-enabled/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: adk-trace-enabled
  namespace: kagent
spec:
  description: Programmatic Go ADK agent with a traced model and addition tool.
  modelConfig:
    name: default-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: adk-trace-enabled
  namespace: kagent
spec:
  template:
    ref:
      name: adk-trace-enabled
  harnessRef:
    name: adk-trace-enabled
