apiVersion: api.kagent.dev/v1alpha3
kind: Harness
metadata:
  name: adk-trace-enabled
  namespace: kagent
spec:
  kagent: {}
  workload:
    image: YOUR_IMAGE_NAME_AND_REGISTRY_URL
    command: ["/app"]
  env:
    - name: MODEL_NAME
      value: gpt-4.1-mini
  substrate:
    workerPoolRef:
      name: kagent-default
    snapshotPolicy:
      location: gs://ate-snapshots/kagent/adk-trace-enabled/
---
apiVersion: api.kagent.dev/v1alpha3
kind: AgentTemplate
metadata:
  name: adk-trace-enabled
  namespace: kagent
spec:
  description: Programmatic Go ADK agent with a traced model and addition tool.
  modelConfig:
    name: default-model-config
---
apiVersion: api.kagent.dev/v1alpha3
kind: Agent
metadata:
  name: adk-trace-enabled
  namespace: kagent
spec:
  templateRef:
    name: adk-trace-enabled
  harnessRef:
    name: adk-trace-enabled
